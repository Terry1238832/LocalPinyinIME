name: Website

# Publishes site/ to GitHub Pages (Settings → Pages → Source: GitHub Actions).
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "assets/branding/theme/design_tokens.json"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "site/**"
      - "assets/branding/theme/design_tokens.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Candidate palettes match the design tokens
        run: python3 site/scripts/candidate_tokens.py --check
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r site/index.html site/assets _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
